name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          name: dist
          path: dist

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: tar -czf dist.tar.gz -C dist .

      - name: Publish build as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sha-${{ github.sha }}
          prerelease: true
          files: dist.tar.gz

      - name: Notify adieu-infra
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.INFRA_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/adieu-app/adieu-infra/dispatches \
            -d '{"event_type":"adieu-app-built","client_payload":{"release_tag":"sha-${{ github.sha }}"}}'
